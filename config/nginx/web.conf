# /etc/nginx/conf.d/web.conf
# HTTPS + mutual TLS (mTLS) with certificates issued by the lab's private CA.
server {
    listen 443 ssl;
    server_name web.lab.local;

    # Server certificate (issued via ACME, renewed every day by step ca renew --daemon)
    ssl_certificate     /etc/nginx/certs/web.crt;
    ssl_certificate_key /etc/nginx/certs/web.key;

    # mTLS: only clients with a certificate chaining to Lab Intermediate CA -> Lab Root CA
    ssl_client_certificate /etc/nginx/certs/ca-bundle.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;

    default_type text/plain;
    location / { return 200 "PKI lab OK, cliente: $ssl_client_s_dn\n"; }
}
